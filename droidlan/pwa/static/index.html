<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4CAF50">
    <title>droidlan transfer</title>
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <link rel="icon" href="/pwa/icon-192.png" sizes="192x192">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 24px;
            background: #0f1115;
            color: #e8eaed;
            min-height: 100vh;
        }
        h1 { font-size: 22px; margin: 0 0 16px; }
        p.lede { margin: 0 0 24px; color: #9aa0a6; line-height: 1.5; }
        form { display: grid; gap: 16px; }
        .drop {
            border: 2px dashed #4CAF50;
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            background: #161a22;
            transition: background 120ms ease, border-color 120ms ease;
        }
        .drop.drag { background: #1d2a1f; border-color: #69d27c; }
        input[type=file] { display: block; margin: 12px auto 0; color: #e8eaed; }
        button {
            font-size: 18px;
            padding: 14px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { min-height: 24px; font-size: 15px; color: #9aa0a6; }
        .status.ok { color: #69d27c; }
        .status.err { color: #ef6c6c; }
        footer { margin-top: 32px; font-size: 12px; color: #5f6368; }
    </style>
</head>
<body>
    <h1>Send files to PC</h1>
    <p class="lede">
        Installable, works offline once the shell loads. Pick or drop files;
        the upload goes straight to the python server on your LAN.
    </p>
    <form id="form" method="POST" action="/" enctype="multipart/form-data">
        <label class="drop" id="drop">
            Tap to pick files, or drop them here.
            <input type="file" name="file" id="file" multiple required>
        </label>
        <button id="send" type="submit">Send</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <footer>
        droidlan PWA — local-only transfer. Re-open from your home screen for the standalone experience.
    </footer>
    <script>
        const drop = document.getElementById('drop');
        const file = document.getElementById('file');
        const form = document.getElementById('form');
        const send = document.getElementById('send');
        const status = document.getElementById('status');

        ['dragenter', 'dragover'].forEach((ev) =>
            drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
        ['dragleave', 'drop'].forEach((ev) =>
            drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
        drop.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files.length) {
                file.files = e.dataTransfer.files;
            }
        });

        form.addEventListener('submit', async (e) => {
            if (!file.files.length) return;
            e.preventDefault();
            send.disabled = true;
            status.textContent = 'Uploading ' + file.files.length + ' file(s)…';
            status.className = 'status';
            try {
                const res = await fetch('/', { method: 'POST', body: new FormData(form) });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                status.textContent = 'Sent ' + file.files.length + ' file(s).';
                status.className = 'status ok';
                form.reset();
            } catch (err) {
                status.textContent = 'Failed: ' + err.message;
                status.className = 'status err';
            } finally {
                send.disabled = false;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/pwa/sw.js', { scope: '/pwa/' }).catch(() => {});
        }
    </script>
</body>
</html>
